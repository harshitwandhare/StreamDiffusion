# Kohaku v2.1: 3-step, better artistic detail
# Best for: detailed stylization, still installations, high-quality outputs
# RTX 2060 actual: ~3-4 fps xformers | ~6-10 fps tensorrt (estimated)

model:
  id: "KBlueLeaf/kohaku-v2.1"
  use_tiny_vae: true
  use_lcm_lora: true           # LCM-LoRA reduces needed steps

inference:
  mode: "img2img"
  width: 512
  height: 512
  t_index_list: [22, 32, 45]  # 3-step denoising queue
  cfg_type: "self"             # residual CFG - uses previous frame as baseline
  guidance_scale: 1.2
  delta: 0.5
  num_inference_steps: 50
  acceleration: "xformers"
  warmup: 10
  seed: 42
  enable_similar_image_filter: false

prompts:
  default: "detailed oil painting, rich textures, warm tones, museum quality"
  negative: "blurry, low quality, watermark, digital artifacts"

osc:
  in_port: 9000
  out_port: 9001
  host: "127.0.0.1"

output:
  show_window: true
  save_frames: true
  frame_dir: "td_out"
